name: jasper
description: >-
  Static site generator for the Mellisuga landing page. Renders the shared
  product content as hand-written HTML, CSS and SVG with no runtime
  dependencies.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.0

dependencies:
  # The single source of truth for what Mellisuga is, what its tools do and
  # what its legal documents say. The app reads exactly the same package.
  mellisuga_content:
    path: ../../packages/mellisuga_content

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
