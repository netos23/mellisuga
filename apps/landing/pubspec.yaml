name: landing
description: >-
  The Mellisuga landing page: the shared product content rendered as static
  HTML, CSS and SVG with Jaspr, with no client-side framework in the output.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.0

dependencies:
  # The web framework the pages are written in. Only its server-side renderer
  # is used: components are rendered to HTML files at build time, and nothing
  # of Jaspr itself is shipped to the browser.
  jaspr: ^0.23.4

  # The single source of truth for what Mellisuga is, what its tools do and
  # what its legal documents say. The app reads exactly the same package.
  mellisuga_content:
    path: ../../packages/mellisuga_content

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
