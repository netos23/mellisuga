name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages, but nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish so a partially
# uploaded site is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # One deployment, two artifacts: the landing site at the root and the
      # Flutter app underneath it at /app/. They are built separately and only
      # meet in the upload directory — the app never contains the landing page,
      # and the landing page only ever links to the app.
      - name: Work out where the site will live
        id: urls
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "base_href=/$repo/"
            echo "site_url=https://${GITHUB_REPOSITORY_OWNER}.github.io/$repo/"
            echo "app_base_href=/$repo/app/"
          } >> "$GITHUB_OUTPUT"

      - name: Install app dependencies
        working-directory: apps/mellisuga
        run: flutter pub get

      - name: Test the app
        working-directory: apps/mellisuga
        run: flutter test

      - name: Test the shared content package
        working-directory: packages/mellisuga_content
        run: |
          dart pub get
          dart test

      - name: Test the landing generator
        working-directory: apps/jasper
        run: |
          dart pub get
          dart test

      - name: Build the landing site
        working-directory: apps/jasper
        # Analytics vendor IDs are optional — see SECRETS_SETUP.md. Every one
        # of these defaults to empty when the secret is not set, and a build
        # with nothing set emits no consent banner and no analytics script.
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID_WEB: ${{ secrets.FIREBASE_APP_ID_WEB }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          YANDEX_METRICA_COUNTER_ID: ${{ secrets.YANDEX_METRICA_COUNTER_ID }}
          APPMETRICA_WEB_API_KEY: ${{ secrets.APPMETRICA_WEB_API_KEY }}
        run: |
          dart run bin/build.dart \
            --out "$GITHUB_WORKSPACE/_site" \
            --base-href "${{ steps.urls.outputs.base_href }}" \
            --site-url "${{ steps.urls.outputs.site_url }}"

      - name: Build the app
        working-directory: apps/mellisuga
        # `--no-web-resources-cdn` bundles CanvasKit locally so the app makes no
        # third-party requests at runtime unless analytics is both configured
        # and consented to — see SECRETS_SETUP.md and ANALYTICS.md. Every
        # --dart-define below defaults to empty when its secret is unset.
        run: |
          flutter build web \
            --release \
            --base-href "${{ steps.urls.outputs.app_base_href }}" \
            --no-web-resources-cdn \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID_WEB="${{ secrets.FIREBASE_APP_ID_WEB }}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_MEASUREMENT_ID="${{ secrets.FIREBASE_MEASUREMENT_ID }}" \
            --dart-define=APPMETRICA_WEB_API_KEY="${{ secrets.APPMETRICA_WEB_API_KEY }}" \
            --dart-define=YANDEX_METRICA_COUNTER_ID="${{ secrets.YANDEX_METRICA_COUNTER_ID }}"

      - name: Assemble the deployment
        run: |
          mkdir -p _site/app
          cp -r apps/mellisuga/build/web/. _site/app/
          # The landing site's 404 page is the only one Pages serves for a
          # missing path, including paths under /app/, so it links to both.
          test -f _site/404.html
          test -f _site/.nojekyll
          test -f _site/app/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
